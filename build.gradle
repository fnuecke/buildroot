plugins {
    id 'java'
    id 'maven-publish'
}

def getGitRef() {
    try {
        final def ref = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return ref.isEmpty() ? 'unknown' : ref
    } catch (final Throwable ignored) {
        return 'unknown'
    }
}

version = "${semver}+${getGitRef()}"
group = 'li.cil.sedna'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}


import org.apache.tools.ant.taskdefs.condition.Os

import java.nio.file.Files

final def buildrootDockerImage = (project.findProperty("buildrootDockerImage") ?: "registry.gitlab.com/buildroot.org/buildroot/base:20230207.1123").toString()
final def buildrootDockerHome = file("output/.docker-home")

final def findExecutable = { final String name ->
    System.getenv("PATH")?.split(File.pathSeparator)?.collect { new File(it, name) }?.find { it.isFile() && it.canExecute() }
}

final boolean isUnix = Os.isFamily(Os.FAMILY_UNIX)
final boolean hasDocker = findExecutable("docker") != null
final boolean useDocker = isUnix && hasDocker && !project.hasProperty("buildrootNativeMake")

final def makeCommandLine = { final List<String> args ->
    if (!useDocker) {
        return args
    }
    final def uid = Files.getAttribute(projectDir.toPath(), "unix:uid")
    final def gid = Files.getAttribute(projectDir.toPath(), "unix:gid")
    return ["docker", "run", "--rm",
            "-u", "${uid}:${gid}".toString(),
            "-v", "${projectDir}:/build".toString(),
            "-w", "/build",
            "-e", "HOME=/build/output/.docker-home"] + [buildrootDockerImage] + args
}

final def warnIfNativeMake = {
    if (isUnix && !useDocker) {
        logger.log(LogLevel.WARN, hasDocker
            ? "Running buildroot's make on the host (-PbuildrootNativeMake). This is not expected to succeed on a modern distribution."
            : "docker not found; falling back to a native buildroot make. This is not expected to succeed on a modern distribution.")
    }
}

final def buildrootDefconfig = file("configs/sedna-riscv64_defconfig")
final def buildrootConfig = file(".config")

task configureBuildroot(type: Exec) {
    if (!isUnix) {
        enabled = false
    } else {
        commandLine(makeCommandLine(["make", "sedna-riscv64_defconfig"]))
        doFirst { buildrootDockerHome.mkdirs() }
    }
    inputs.file buildrootDefconfig
    outputs.file buildrootConfig
}

task cleanBuildroot(type: Exec) {
    if (isUnix) {
        commandLine(makeCommandLine(["make", "clean"]))
        dependsOn configureBuildroot
    } else {
        enabled = false
    }
}
clean.dependsOn cleanBuildroot

final def buildrootImages = ["output/images/fw_jump.bin", "output/images/Image", "output/images/rootfs.ext2"]

final def buildrootInputs = files(buildrootDefconfig, "board/sedna-riscv64", "package/tinycc")

task compileBuildroot(type: Exec) {
    if (!isUnix) {
        logger.log(LogLevel.WARN, "Can only make buildroot on Linux. Expecting output files to have been manually placed in [output/images/].")
        enabled = false
    } else {
        warnIfNativeMake()
        commandLine(makeCommandLine(["make"]))
        doFirst { buildrootDockerHome.mkdirs() }
    }
    inputs.files buildrootInputs
    inputs.property "dockerImage", buildrootDockerImage
    inputs.property "useDocker", useDocker
    outputs.files buildrootImages
    dependsOn configureBuildroot
}

task generateLegalInfo(type: Exec) {
    if (!isUnix) {
        enabled = false
    } else {
        commandLine(makeCommandLine(["make", "legal-info"]))
        doFirst { buildrootDockerHome.mkdirs() }
    }
    inputs.files buildrootInputs
    inputs.property "dockerImage", buildrootDockerImage
    inputs.property "useDocker", useDocker
    outputs.dirs "output/legal-info/licenses"
    dependsOn configureBuildroot
}

task copyBuildrootImages(type: Copy) {
    doFirst { delete "src/main/resources/generated" }
    from compileBuildroot.outputs.files
    into "src/main/resources/generated/"
}

task copyBuildrootLicenses(type: Copy) {
    doFirst { delete "src/main/resources/licenses" }
    from generateLegalInfo.outputs.files
    into "src/main/resources/licenses/"
}

copyBuildrootImages.dependsOn(compileBuildroot)
copyBuildrootImages.dependsOn(generateLegalInfo)
compileJava.dependsOn(copyBuildrootImages)
compileJava.dependsOn(copyBuildrootLicenses)
processResources.dependsOn(copyBuildrootImages)
processResources.dependsOn(copyBuildrootLicenses)

jar {
    archiveVersion = semver
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = semver
            artifact jar

            pom {
                name = "Sedna Buildroot"
                description = "Prebuilt RISC-V Linux images (OpenSBI firmware, kernel and root filesystem) for the Sedna emulator."
                url = "https://github.com/fnuecke/buildroot"
                licenses {
                    license {
                        name = "GPL-2.0-or-later"
                        url = "https://github.com/fnuecke/buildroot/blob/sedna/COPYING"
                    }
                }
                developers {
                    developer {
                        id = "fnuecke"
                        name = "Florian Nücke"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/fnuecke/buildroot.git"
                    developerConnection = "scm:git:ssh://git@github.com/fnuecke/buildroot.git"
                    url = "https://github.com/fnuecke/buildroot"
                }
            }
        }
    }
    repositories {
        final def mavenRepoDir = project.findProperty("mavenRepoDir")?.toString()
        if (mavenRepoDir) {
            maven {
                name = "StaticMavenRepo"
                url = uri(file(mavenRepoDir))
            }
        }
    }
}
