name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use"
        required: false
        default: "0.0.0-dryrun"
      publish:
        description: "Publish to fnuecke/maven repository"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUILDROOT_DOCKER_IMAGE: ${{ vars.BUILDROOT_DOCKER_IMAGE || 'buildroot/base:20200814.2228' }}
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out buildroot
        uses: actions/checkout@v4
        with:
          path: buildroot

      - name: Check out the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        uses: actions/checkout@v4
        with:
          repository: fnuecke/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven

      # A full buildroot build with its own toolchain needs ~8-12 GB; runners start with ~14 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('buildroot/**/*.gradle*', 'buildroot/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache buildroot downloads
        uses: actions/cache@v4
        with:
          path: |
            buildroot/dl
            buildroot/output/.docker-home
          key: buildroot-${{ hashFiles('buildroot/configs/sedna-riscv64_defconfig') }}
          restore-keys: buildroot-

      - name: Pull the buildroot container image
        run: docker pull "$BUILDROOT_DOCKER_IMAGE"

      - name: Build with Gradle
        working-directory: buildroot
        run: >-
          ./gradlew build
          -Psemver="$VERSION"
          -PbuildrootDockerImage="$BUILDROOT_DOCKER_IMAGE"

      - name: Add artifacts to the GitHub release
        if: github.event_name == 'release'
        working-directory: buildroot
        run: gh release upload "$VERSION" ./build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: buildroot
        run: >-
          ./gradlew publish
          -Psemver="$VERSION"
          -PbuildrootDockerImage="$BUILDROOT_DOCKER_IMAGE"
          -PmavenRepoDir="${{ github.workspace }}/maven"

      - name: Commit and push the static Maven repository
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: maven
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "sedna-buildroot $VERSION"
          git push
